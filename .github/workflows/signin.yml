name: TRAE 每日签到

on:
  schedule:
    # 北京时间 13:37（午后，避开早上 8 点的签到高峰）
    - cron: '37 5 * * *'
    # 北京时间 21:37（晚间再补一次，双保险）
    - cron: '37 13 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      - name: 生成凭证文件
        run: |
          mkdir -p auths
          echo '${{ secrets.TRAE_AUTH_1 }}' > auths/trae-1.json

      - name: 执行签到（限流自动重试）
        run: |
          for i in 1 2 3 4 5 6; do
            OUTPUT=$(./signin_bin auths 2>&1)
            echo "--- 第 $i 次尝试 ---"
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qE '签到成功=[1-9]|已签=[1-9]'; then
              echo "确认签到成功，结束"
              break
            fi
            echo "未确认成功（多半是 TRAE 限流），3 分钟后重试"
            sleep 180
          done
          echo "SIGNIN_OUTPUT<<EOF" >> $GITHUB_ENV
          echo "$OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 提取结果
        id: result
        run: |
          echo "$SIGNIN_OUTPUT" | grep -oP '总计=\K\d+' | head -1 | xargs -I{} echo "total={}" >> $GITHUB_OUTPUT || echo "total=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '签到成功=\K\d+' | head -1 | xargs -I{} echo "ok={}" >> $GITHUB_OUTPUT || echo "ok=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '已签=\K\d+' | head -1 | xargs -I{} echo "already={}" >> $GITHUB_OUTPUT || echo "already=?" >> $GITHUB_OUTPUT
          echo "$SIGNIN_OUTPUT" | grep -oP '失败=\K\d+' | head -1 | xargs -I{} echo "fail={}" >> $GITHUB_OUTPUT || echo "fail=?" >> $GITHUB_OUTPUT

      - name: 今日已签过（重复运行，正常）
        if: steps.result.outputs.ok == '0' && steps.result.outputs.already != '0'
        run: echo "今天已经签到过了，这次是重复运行，无需处理"

      - name: 仍未签到成功则报错
        if: steps.result.outputs.ok == '0' && steps.result.outputs.already == '0'
        run: |
          echo "::error::签到未成功，已重试 6 次（大概率 TRAE 限流）"
          exit 1

      - name: 清理凭证
        if: always()
        run: rm -rf auths

      - name: keepalive
        if: always()
        run: |
          git config user.name "trae-signin-bot"
          git config user.email "bot@users.noreply.github.com"
          echo "last run: $(date -u)" > KEEPALIVE.md
          git add KEEPALIVE.md
          git diff --cached --quiet || git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
