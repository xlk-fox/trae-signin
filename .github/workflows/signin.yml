name: TRAE 每日签到

on:
  schedule:
    # 北京时间 06:07 / 08:07 / 13:37 / 21:37
    # 早上先签（起床就有积分），下午晚上兜底。避开整点，减少 GitHub 排队延迟。
    - cron: '7 22 * * *'
    - cron: '7 0 * * *'
    - cron: '37 5 * * *'
    - cron: '37 13 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      - name: 生成凭证文件
        run: |
          mkdir -p auths
          echo '${{ secrets.TRAE_AUTH_1 }}' > auths/trae-1.json

      - name: 执行签到（每次都向 TRAE 核实真实状态）
        run: |
          TOKEN=$(python3 -c "import json;print(json.load(open('auths/trae-1.json'))['auth']['accessToken'])")
          DEV=$(python3 -c "import json;print(json.load(open('auths/trae-1.json'))['auth']['deviceId'])")
          for i in 1 2 3 4; do
            echo "=== 第 $i 次尝试 ==="
            ./signin_bin auths 2>&1 || true
            ST=$(curl -s -X POST 'https://api.trae.cn/trae/api/v2/ug/checkin_credits/status' \
              -H "Authorization: Cloud-IDE-JWT $TOKEN" \
              -H "X-User-Region: CN" \
              -H "X-Device-Id: $DEV" \
              -H 'Content-Type: application/json' \
              -d '{}')
            echo "TRAE 真实状态: $ST"
            if echo "$ST" | grep -qE '"checked_in"[[:space:]]*:[[:space:]]*true'; then
              echo "已确认签到成功"
              break
            fi
            echo "实际仍未签到（大概率是 TRAE 限流），3 分钟后重试"
            sleep 180
          done

      - name: 最终核实（没签到就报错标红）
        run: |
          TOKEN=$(python3 -c "import json;print(json.load(open('auths/trae-1.json'))['auth']['accessToken'])")
          DEV=$(python3 -c "import json;print(json.load(open('auths/trae-1.json'))['auth']['deviceId'])")
          ST=$(curl -s -X POST 'https://api.trae.cn/trae/api/v2/ug/checkin_credits/status' \
            -H "Authorization: Cloud-IDE-JWT $TOKEN" \
            -H "X-User-Region: CN" \
            -H "X-Device-Id: $DEV" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "最终状态: $ST"
          if ! echo "$ST" | grep -qE '"checked_in"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::本轮重试后仍未签到成功"
            exit 1
          fi

      - name: 清理凭证
        if: always()
        run: rm -rf auths

      - name: keepalive
        if: always()
        run: |
          git config user.name "trae-signin-bot"
          git config user.email "bot@users.noreply.github.com"
          echo "last run: $(date -u)" > KEEPALIVE.md
          git add KEEPALIVE.md
          git diff --cached --quiet || git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
